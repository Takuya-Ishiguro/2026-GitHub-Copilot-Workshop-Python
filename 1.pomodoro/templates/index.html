<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポモドーロタイマー - ゲーミフィケーション</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }
        
        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .timer-card {
            text-align: center;
        }
        
        .timer-display {
            font-size: 5em;
            font-weight: bold;
            color: #667eea;
            margin: 20px 0;
            font-family: 'Courier New', monospace;
        }
        
        .timer-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }
        
        button {
            padding: 12px 30px;
            font-size: 1.1em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
            transform: translateY(-2px);
        }
        
        .stats-card h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.5em;
        }
        
        .level-display {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        .level-number {
            font-size: 3em;
            font-weight: bold;
        }
        
        .xp-bar {
            background: rgba(255,255,255,0.3);
            height: 30px;
            border-radius: 15px;
            overflow: hidden;
            margin-top: 10px;
        }
        
        .xp-progress {
            background: #ffd700;
            height: 100%;
            transition: width 0.5s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #333;
        }
        
        .streak-display {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
        }
        
        .streak-item {
            text-align: center;
        }
        
        .streak-number {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
        }
        
        .streak-label {
            color: #666;
            margin-top: 5px;
        }
        
        .badges-section {
            margin-top: 20px;
        }
        
        .badges-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }
        
        .badge {
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(255,215,0,0.3);
        }
        
        .badge-icon {
            font-size: 2em;
            margin-bottom: 5px;
        }
        
        .badge-name {
            font-size: 0.9em;
            font-weight: bold;
            color: #333;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 20px;
        }
        
        .stat-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }
        
        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }
        
        .stat-label {
            color: #666;
            margin-top: 5px;
        }
        
        .chart-container {
            margin-top: 20px;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
        }
        
        .bar-chart {
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            height: 200px;
            margin-top: 15px;
        }
        
        .bar {
            flex: 1;
            background: #667eea;
            margin: 0 5px;
            border-radius: 5px 5px 0 0;
            position: relative;
            transition: all 0.3s;
        }
        
        .bar:hover {
            background: #764ba2;
        }
        
        .bar-label {
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.8em;
            color: #666;
            white-space: nowrap;
        }
        
        .bar-value {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-weight: bold;
            color: #667eea;
        }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            z-index: 1000;
            animation: slideIn 0.3s;
            max-width: 300px;
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        .notification.success {
            border-left: 5px solid #4caf50;
        }
        
        .notification.level-up {
            border-left: 5px solid #ffd700;
        }
        
        .timer-mode {
            margin-bottom: 10px;
            color: #666;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🍅 ポモドーロタイマー</h1>
            <p>集中力を高めて、成長しよう！</p>
        </header>
        
        <div class="main-grid">
            <!-- タイマーカード -->
            <div class="card timer-card">
                <div class="timer-mode" id="timerMode">作業時間</div>
                <div class="timer-display" id="timerDisplay">25:00</div>
                <div class="timer-controls">
                    <button class="btn-primary" id="startBtn" onclick="startTimer()">開始</button>
                    <button class="btn-secondary" id="pauseBtn" onclick="pauseTimer()" style="display:none;">一時停止</button>
                    <button class="btn-secondary" id="resetBtn" onclick="resetTimer()">リセット</button>
                </div>
            </div>
            
            <!-- レベル＆XPカード -->
            <div class="card stats-card">
                <h2>レベル & 経験値</h2>
                <div class="level-display">
                    <div>レベル <span class="level-number" id="levelDisplay">1</span></div>
                    <div class="xp-bar">
                        <div class="xp-progress" id="xpProgress" style="width: 0%;">
                            <span id="xpText">0 / 500 XP</span>
                        </div>
                    </div>
                </div>
                
                <div class="streak-display">
                    <div class="streak-item">
                        <div class="streak-number" id="currentStreak">0</div>
                        <div class="streak-label">連続日数</div>
                    </div>
                    <div class="streak-item">
                        <div class="streak-number" id="maxStreak">0</div>
                        <div class="streak-label">最長記録</div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- バッジセクション -->
        <div class="card">
            <h2>🏆 達成バッジ</h2>
            <div class="badges-section">
                <div class="badges-grid" id="badgesGrid">
                    <div style="text-align: center; color: #999; grid-column: 1/-1;">
                        ポモドーロを完了してバッジを獲得しよう！
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 統計セクション -->
        <div class="main-grid">
            <!-- 週間統計 -->
            <div class="card">
                <h2>📊 週間統計</h2>
                <div class="stats-grid">
                    <div class="stat-box">
                        <div class="stat-number" id="weeklyCount">0</div>
                        <div class="stat-label">今週の完了数</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-number" id="weeklyRate">0%</div>
                        <div class="stat-label">達成率</div>
                    </div>
                </div>
                
                <div class="chart-container">
                    <h3>日別完了数</h3>
                    <div class="bar-chart" id="weeklyChart"></div>
                </div>
            </div>
            
            <!-- 月間統計 -->
            <div class="card">
                <h2>📈 月間統計</h2>
                <div class="stats-grid">
                    <div class="stat-box">
                        <div class="stat-number" id="monthlyCount">0</div>
                        <div class="stat-label">今月の完了数</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-number" id="monthlyRate">0%</div>
                        <div class="stat-label">達成率</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-number" id="avgDuration">0</div>
                        <div class="stat-label">平均集中時間（分）</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let timerInterval = null;
        let timeLeft = 25 * 60; // 25分（秒単位）
        let isWorkTime = true;
        let isRunning = false;
        
        // 統計を読み込む
        function loadStats() {
            fetch('/api/stats')
                .then(response => response.json())
                .then(data => {
                    updateDisplay(data);
                })
                .catch(error => console.error('Error:', error));
        }
        
        // 表示を更新
        function updateDisplay(data) {
            const stats = data.user_stats;
            const badges = data.badges;
            const weekly = data.weekly_stats;
            const monthly = data.monthly_stats;
            
            // レベル＆XP
            document.getElementById('levelDisplay').textContent = stats.level;
            const xpPercent = (stats.xp_progress / stats.xp_needed) * 100;
            document.getElementById('xpProgress').style.width = xpPercent + '%';
            document.getElementById('xpText').textContent = 
                `${stats.xp_progress} / ${stats.xp_needed} XP`;
            
            // ストリーク
            document.getElementById('currentStreak').textContent = stats.current_streak;
            document.getElementById('maxStreak').textContent = stats.max_streak;
            
            // バッジ
            const badgesGrid = document.getElementById('badgesGrid');
            if (badges.length > 0) {
                badgesGrid.innerHTML = badges.map(badge => `
                    <div class="badge">
                        <div class="badge-icon">🏆</div>
                        <div class="badge-name">${badge.type}</div>
                    </div>
                `).join('');
            }
            
            // 週間統計
            document.getElementById('weeklyCount').textContent = weekly.total_count;
            document.getElementById('weeklyRate').textContent = weekly.completion_rate + '%';
            
            // 週間チャート
            const maxCount = Math.max(...weekly.daily_counts.map(d => d.count), 1);
            const weeklyChart = document.getElementById('weeklyChart');
            weeklyChart.innerHTML = weekly.daily_counts.map(day => {
                const height = (day.count / maxCount) * 100;
                const date = new Date(day.date);
                const label = ['日', '月', '火', '水', '木', '金', '土'][date.getDay()];
                return `
                    <div class="bar" style="height: ${height}%;">
                        <div class="bar-value">${day.count}</div>
                        <div class="bar-label">${label}</div>
                    </div>
                `;
            }).join('');
            
            // 月間統計
            document.getElementById('monthlyCount').textContent = monthly.total_count;
            document.getElementById('monthlyRate').textContent = monthly.completion_rate + '%';
            document.getElementById('avgDuration').textContent = monthly.avg_duration;
        }
        
        // タイマー開始
        function startTimer() {
            if (!isRunning) {
                isRunning = true;
                document.getElementById('startBtn').style.display = 'none';
                document.getElementById('pauseBtn').style.display = 'inline-block';
                
                timerInterval = setInterval(() => {
                    timeLeft--;
                    updateTimerDisplay();
                    
                    if (timeLeft <= 0) {
                        timerComplete();
                    }
                }, 1000);
            }
        }
        
        // タイマー一時停止
        function pauseTimer() {
            isRunning = false;
            clearInterval(timerInterval);
            document.getElementById('startBtn').style.display = 'inline-block';
            document.getElementById('pauseBtn').style.display = 'none';
        }
        
        // タイマーリセット
        function resetTimer() {
            pauseTimer();
            timeLeft = isWorkTime ? 25 * 60 : 5 * 60;
            updateTimerDisplay();
        }
        
        // タイマー表示を更新
        function updateTimerDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            document.getElementById('timerDisplay').textContent = 
                `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }
        
        // タイマー完了
        function timerComplete() {
            pauseTimer();
            
            if (isWorkTime) {
                // 作業時間完了
                showNotification('ポモドーロ完了！', 'success');
                
                // サーバーに記録
                fetch('/api/complete_pomodoro', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ duration: 25 })
                })
                .then(response => response.json())
                .then(data => {
                    // レベルアップ通知
                    if (data.leveled_up) {
                        showLevelUpNotification(data.new_level);
                    }
                    
                    // バッジ通知
                    if (data.new_badges && data.new_badges.length > 0) {
                        data.new_badges.forEach(badge => {
                            setTimeout(() => showBadgeNotification(badge), 1000);
                        });
                    }
                    
                    // 統計を再読み込み
                    setTimeout(() => loadStats(), 2000);
                });
                
                // 休憩時間に切り替え
                isWorkTime = false;
                timeLeft = 5 * 60;
                document.getElementById('timerMode').textContent = '休憩時間';
            } else {
                // 休憩時間完了
                showNotification('休憩終了！次のポモドーロを始めよう', 'success');
                
                // 作業時間に切り替え
                isWorkTime = true;
                timeLeft = 25 * 60;
                document.getElementById('timerMode').textContent = '作業時間';
            }
            
            updateTimerDisplay();
        }
        
        // 通知を表示
        function showNotification(message, type) {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.innerHTML = `<strong>${message}</strong>`;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }
        
        // レベルアップ通知
        function showLevelUpNotification(level) {
            const notification = document.createElement('div');
            notification.className = 'notification level-up';
            notification.innerHTML = `
                <div style="font-size: 1.5em; text-align: center;">
                    🎉 レベルアップ！<br>
                    <strong>レベル ${level}</strong>
                </div>
            `;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 4000);
        }
        
        // バッジ通知
        function showBadgeNotification(badgeName) {
            const notification = document.createElement('div');
            notification.className = 'notification success';
            notification.innerHTML = `
                <div style="text-align: center;">
                    🏆 新しいバッジ獲得！<br>
                    <strong>${badgeName}</strong>
                </div>
            `;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }
        
        // 初期化
        loadStats();
    </script>
</body>
</html>
